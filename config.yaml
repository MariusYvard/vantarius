# ─────────────────────────────────────────────────────────────────────────────
# Vantarius — Configuration
# Edit this file to match your CRM, outreach style, and quotas.
# Run `node setup.js` first to create your LinkedIn session.
# ─────────────────────────────────────────────────────────────────────────────

# ── CRM (shared with AxioMariuS if used together) ────────────────────────────
crm:
  file: "CRM.xlsx"
  sheet: "Pipeline"
  data_start_row: 2

  # Column mapping (1-based Excel column indices)
  columns:
    company:          1    # A
    stage:            2    # B
    first_name:       3    # C
    last_name:        4    # D
    title:            5    # E
    email:            6    # F (optional — for email outreach)
    linkedin_url:     7    # G
    signal:           8    # H — tension signal from AxioMariuS
    date_contact:     9    # I — date of first contact (J0)
    next_contact:     10   # J
    notes:            11   # K

  # Pipeline stage labels (written to the CRM)
  status_j0:      "Invite sent"
  status_j3:      "Follow-up J+3"
  status_j7:      "Follow-up J+7"
  status_j10:     "Closed J+10"
  status_replied: "Reply received"
  status_error:   "Error — retry"

# ── LLM (local, via Ollama) ───────────────────────────────────────────────────
llm:
  model: "gemma3:12b"

  # Message quality threshold (0-10, AI self-evaluation).
  # Messages scoring below this are rewritten once.
  quality_threshold: 7

  # Words absolutely forbidden in generated messages.
  # Add any terms that clash with your brand/tone.
  forbidden_words:
    - "solution"
    - "wellness"
    - "well-being"
    - "happiness"
    - "team building"
    - "mindfulness"
    - "cordialement"
    - "hope you are well"

# ── LinkedIn ─────────────────────────────────────────────────────────────────
linkedin:
  session_dir: "./chrome-session"    # shared with AxioMariuS if co-located
  headless: false
  protocol_timeout: 180000

  # Daily / weekly LinkedIn invite quotas (stay well below LinkedIn's real limits)
  quota_per_day:  15
  quota_per_week: 60

  # Delay between leads — longer than AxioMariuS (actual messages, higher risk)
  delay_min: 30000    # 30s
  delay_max: 90000    # 90s

  # Typing speed simulation (ms per keystroke)
  typing_speed_min: 30
  typing_speed_max: 70

# ── Email outreach (optional, J+1 after LinkedIn invite) ─────────────────────
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""       # Or SMTP_USER env variable
  smtp_pass: ""       # Or SMTP_PASS env variable (use app password)
  max_per_day: 30
  delay_min: 60000    # 1 min between emails
  delay_max: 180000   # 3 min

# ── Working hours (no messages sent outside this window) ─────────────────────
working_hours:
  start: 9     # 9:00 AM
  end:   18    # 6:00 PM

# ── Message timing (days after J0) ───────────────────────────────────────────
timing:
  j1:  1
  j3:  3
  j7:  7
  j10: 10

# ── Message templates ─────────────────────────────────────────────────────────
# Variables available: {FIRST_NAME}, {COMPANY}, {SIGNAL}
# These are base templates — the LLM rewrites them using actual signal context.
# Keep them as starting points; the LLM does the heavy lifting.
messages:
  j0: >
    I've identified organisational friction signals at {COMPANY} — the kind of
    tension that builds silently before it impacts performance. Worth a 15-min chat?

  j3: >
    Sharing some concrete data on {COMPANY} — the signals I mentioned are measurable
    and actionable. Does this resonate?

  j7: >
    One last thought: organisations at {COMPANY}'s scale often have a gap between
    leadership decisions and field execution that's invisible until it costs.
    Happy to discuss if the timing works.

  j10: >
    I won't clutter your inbox further. If the subject comes back around,
    I'm available. Take care.

# ── Follow-up detection ───────────────────────────────────────────────────────
reply_detection:
  # Scan LinkedIn DMs to auto-detect replies and update CRM status
  enabled: false     # Enable once your J0 pipeline is running smoothly

# ── Debug ─────────────────────────────────────────────────────────────────────
debug:
  dry_run: false     # true = log what would happen, send nothing
  dir: "./debug"
  max_files: 20
